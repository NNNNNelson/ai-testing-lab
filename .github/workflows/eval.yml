name: eval

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  offline:
    name: offline checks (no model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core deps
        run: pip install pytest pyyaml numpy
      - name: Metric unit tests + rules-only agent checks
        run: pytest -q tests/test_metrics.py tests/test_agent_routing.py -k "rule_router or kappa or sampling or recall or abstention or routing"
