# RAG golden set (20 cases) — corpus: HSBC Holdings plc Annual Report and Accounts 2024
# Pages refer to the PDF page markers in data/corpus.txt (first 119 pages).
#
# Every fact below was located with scripts/find_fact.py against the extracted text.
# Nothing here is written from memory: if a number is wrong, the retrieval metric is
# measuring my typing, not the system.
#
# gold_sources  = hand-labelled minimum (where I read the fact)
# answer_pattern = regex; all pages containing the answer are added at eval time
#                  (evals/corpus.py). Reports are repeatable, not hand-waved.
#
# Categories:
#   answerable   - single-pass lookup, answer must be grounded
#   multi_hop    - needs two pages, or one page plus arithmetic
#   unanswerable - verified absent from the corpus; the correct behaviour is to refuse

- id: rag-01
  category: answerable
  question: "2024 年的税前利润是多少？与 2023 年相比增加了多少？"
  gold_answer: "税前利润 32.3 亿美元，较 2023 年的 30.3 亿美元增加 2.0 亿美元。"
  gold_sources: [3, 4]
  answer_pattern: "32\\.3bn"

- id: rag-02
  category: answerable
  question: "2024 年净利息收入是多少？较上年变化多少？"
  gold_answer: "净利息收入 327 亿美元，2023 年为 358 亿美元，下降 31 亿美元。"
  gold_sources: [3, 4]
  answer_pattern: "32,733|32\\.7bn"

